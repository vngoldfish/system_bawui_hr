name: Deploy to VPS (Docker Server)

on:
  push:
    branches: [ main ] # Kích hoạt khi bạn push code vào nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước này dùng giao thức SSH để đăng nhập thẳng vào VPS của bạn và gõ lệnh
      - name: SSH into VPS and update Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }} # Điền ubuntu hoặc root tùy cấu hình secret của bạn
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Đã kết nối vào VPS ==="
            cd /opt/apps/system_bawui_hr
            
            # Ép Git trên VPS kéo code mới nhất bạn vừa push lên GitHub về
            git reset --hard
            git pull origin main
            
            # Rebuild và chạy lại container app
            docker compose up -d --build app
            
            echo "=== Hệ thống đã tự động cập nhật xong! ==="
