version: '3.8'

services:
  app:
    build: .
    container_name: system_bawui_hr-app
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@db:5432/${DB_NAME:-hr_db}?schema=public
      - SEED_DB=false
      - PORT=3000
      - NODE_ENV=production
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bawui-net

  db:
    image: postgres:15-alpine
    container_name: system_bawui_hr-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_password}
      - POSTGRES_DB=${DB_NAME:-hr_db}
      - TZ=Asia/Tokyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bawui-net

  backup:
    image: prodrigestivill/postgres-backup-local:15
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME:-hr_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_password}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_ON_START=TRUE
      - TZ=Asia/Tokyo
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bawui-net

volumes:
  pgdata:

networks:
  bawui-net:
    external: true
